<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - Orders</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .order {
      background: #222;
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
    }

    h1 {
      color: #ffcc00;
    }
  </style>
</head>

<body>

<h1>📋 Admin Orders</h1>

<div id="orders"></div>

<script>
function loadOrders() {
  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  document.getElementById("orders").innerHTML =
    orders.map(o =>
      `<div class="order">
        <b>Items:</b> ${o.items}<br>
        <b>Total:</b> ₹${o.total}
      </div>`
    ).join("");
}

loadOrders();
</script>

</body>
</html>
