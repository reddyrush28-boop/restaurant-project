<!DOCTYPE html>
<html>
<head>
  <title>Admin Orders</title>
</head>
<body>

<h2>Orders</h2>
<div id="orders"></div>

<script>
let orders = JSON.parse(localStorage.getItem("orders")) || [];

document.getElementById("orders").innerHTML =
orders.map(o => `
  <div style="margin:10px;padding:10px;border:1px solid black;">
    <b>Total:</b> ₹${o.total}<br>
    <b>Time:</b> ${o.time}
  </div>
`).join("");
</script>

</body>
</html>
