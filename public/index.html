<!DOCTYPE html>
<html>
<head>
  <title>Royal Bite Restaurant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(to right, #0f0f0f, #1f1f1f);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .logo {
      font-size: 40px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .qr {
      margin: 15px 0;
    }

    .qr img {
      width: 160px;
      border-radius: 10px;
      border: 2px solid #ffcc00;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      background: #ffcc00;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: white;
      color: black;
    }

    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGO -->
    <div class="logo">🍽 Royal Bite</div>

    <div class="tagline">
      Taste like royalty 👑 <br>
      Fresh • Fast • Delicious
    </div>

    <!-- QR SECTION -->
    <div class="qr">
      <p>Scan to open menu 📱</p>
      <img src="qr.png" alt="QR Code">
      <div class="hint">Open camera and scan this code</div>
    </div>

    <!-- BUTTON -->
    <a href="menu.html">
      <button>Open Menu 🍴</button>
    </a>

  </div>

</body>
</html>
